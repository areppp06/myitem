<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>MyItem – Find Your Stuff Fast</title>
<meta name="theme-color" content="#0058A3"/>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%230058A3'/><text x='16' y='22' text-anchor='middle' fill='%23FFDA1A' font-size='14' font-weight='bold' font-family='sans-serif'>M</text></svg>"/>
<style>
:root{--ikea-yellow:#FFDA1A;--ikea-blue:#0058A3;--ikea-blue-dark:#003d73;--bg:#f5f5f5;--card:#fff;--text:#111;--muted:#666;--radius:12px;--shadow:0 4px 12px rgba(0,0,0,.08)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:100px}
header{background:var(--ikea-blue);color:#fff;padding:16px 16px 12px;position:sticky;top:0;z-index:50;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.logo{font-weight:800;font-size:1.45rem;letter-spacing:-.8px;margin-bottom:12px;display:flex;align-items:baseline}
.logo .my{color:#fff;font-weight:800}
.logo .item{color:var(--ikea-yellow);font-weight:800}
.search-wrap{position:relative}
#search{width:100%;padding:14px 16px 14px 44px;border:none;border-radius:999px;font-size:16px;background:#fff;color:#111;outline:none;box-shadow:0 2px 6px rgba(0,0,0,.1)}
.search-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);display:flex;align-items:center;color:#888;pointer-events:none}
.categories{display:flex;gap:8px;overflow-x:auto;padding:12px 16px;background:#fff;border-bottom:1px solid #eee;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.categories::-webkit-scrollbar{display:none}
.cat-chip{flex-shrink:0;padding:8px 16px;border-radius:999px;border:2px solid #ddd;background:#fff;font-weight:600;font-size:.9rem;cursor:pointer}
.cat-chip.active{background:var(--ikea-yellow);border-color:var(--ikea-yellow);color:var(--ikea-blue)}
.container{max-width:1200px;margin:0 auto;padding:16px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:600px){.grid{grid-template-columns:repeat(3,1fr);gap:16px}}
@media(min-width:900px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{background:var(--card);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);cursor:pointer;border:2px solid transparent}
.card.expanded{border-color:var(--ikea-blue);grid-column:span 2}
.thumb{width:100%;aspect-ratio:1;object-fit:cover;background:#e8e8e8;display:block}
.thumb.placeholder{display:flex;align-items:center;justify-content:center;background:#f0f0f0}
.card-body{padding:10px 12px 12px}
.card-name{font-weight:700;font-size:.95rem;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-place{font-size:.8rem;color:var(--muted);display:flex;align-items:center;gap:4px}
.card-extra{display:none;margin-top:10px;padding-top:10px;border-top:1px solid #eee;font-size:.85rem}
.card.expanded .card-extra{display:block}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}
.tag{background:#eef5ff;color:var(--ikea-blue);padding:2px 8px;border-radius:6px;font-size:.75rem;font-weight:600}
.meta{color:var(--muted);font-size:.75rem;margin-bottom:10px}
.item-notes{font-size:.85rem;color:#444;background:#f7f7f7;border-radius:8px;padding:8px 10px;margin-bottom:10px;line-height:1.4;white-space:pre-wrap;word-break:break-word}
.char-count{font-size:.75rem;color:#888;text-align:right;margin-top:4px}
textarea#itemNotes{width:100%;padding:12px 14px;border:2px solid #e0e0e0;border-radius:10px;font-size:16px;outline:none;resize:vertical;min-height:72px;font-family:inherit}
textarea#itemNotes:focus{border-color:var(--ikea-blue)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 14px;border-radius:8px;border:none;font-weight:700;font-size:.85rem;cursor:pointer}
.btn-primary{background:var(--ikea-blue);color:#fff}
.btn-yellow{background:var(--ikea-yellow);color:var(--ikea-blue)}
.btn-outline{background:#fff;border:2px solid #ddd;color:#333}
.btn-danger{background:#fff;border:2px solid #e0e0e0;color:#c00;padding:8px 10px}
.btn-row{display:flex;gap:8px;align-items:center}
.pagination{display:flex;justify-content:center;align-items:center;gap:12px;margin-top:24px;padding:16px}
.page-info{font-weight:600;color:var(--muted)}
.fab{position:fixed;bottom:24px;right:24px;width:60px;height:60px;border-radius:50%;background:var(--ikea-yellow);color:var(--ikea-blue);border:none;font-size:32px;font-weight:300;box-shadow:0 6px 20px rgba(0,0,0,.2);cursor:pointer;z-index:40;display:flex;align-items:center;justify-content:center}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;display:none;align-items:flex-end;justify-content:center}
@media(min-width:600px){.modal-overlay{align-items:center}}
.modal-overlay.open{display:flex}
.modal{background:#fff;width:100%;max-width:480px;border-radius:20px 20px 0 0;padding:24px 20px 32px;max-height:90vh;overflow-y:auto}
@media(min-width:600px){.modal{border-radius:16px}}
.modal h2{font-size:1.3rem;margin-bottom:20px;color:var(--ikea-blue)}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-weight:600;font-size:.85rem;margin-bottom:6px;color:#444}
.form-group input{width:100%;padding:12px 14px;border:2px solid #e0e0e0;border-radius:10px;font-size:16px;outline:none}
.form-group input:focus{border-color:var(--ikea-blue)}
.photo-preview{width:120px;height:120px;border-radius:12px;object-fit:cover;background:#f0f0f0;display:none;margin-bottom:8px}
.photo-preview.show{display:block}
.chip-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{padding:6px 12px;border-radius:999px;background:#f0f0f0;font-size:.85rem;cursor:pointer;border:2px solid transparent}
.chip.selected{background:#e0f0ff;border-color:var(--ikea-blue);color:var(--ikea-blue);font-weight:600}
.add-new{color:var(--ikea-blue);font-weight:600;cursor:pointer;font-size:.9rem;margin-top:6px;display:inline-block}
.modal-actions{display:flex;gap:10px;margin-top:24px}
.modal-actions .btn{flex:1;padding:14px}
.empty{text-align:center;padding:60px 20px;color:var(--muted)}
.manage-link{position:absolute;top:18px;right:16px;color:rgba(255,255,255,.85);font-size:.85rem;text-decoration:none;font-weight:600}
.loading{text-align:center;padding:40px;color:var(--muted)}
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:12px 20px;border-radius:999px;font-size:.9rem;z-index:200;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
.confirm-box{text-align:center;padding:8px 0 4px}
.confirm-box .confirm-title{font-size:1.15rem;margin-bottom:8px;line-height:1.4}
.confirm-box .confirm-delete{color:#c00;font-weight:800;font-size:1.2rem}
.confirm-box .confirm-name{font-weight:800;font-size:1.15rem}
</style>
</head>
<body>
<header>
<a href="/manage.html" class="manage-link">Manage</a>
<div class="logo"><span class="my">My</span><span class="item">Item</span></div>
<div class="search-wrap">
<span class="search-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/></svg></span>
<input type="search" id="search" placeholder="Search items, places..." autocomplete="off"/>
</div>
</header>
<div class="categories" id="categories"></div>
<div class="container">
<div id="grid" class="grid"><div class="loading">Loading your items...</div></div>
<div class="pagination" id="pagination" style="display:none"></div>
</div>
<button class="fab" id="fab" title="Add item">+</button>

<div class="modal-overlay" id="modal">
<div class="modal">
<h2 id="modalTitle">Add Item</h2>
<div class="form-group"><label>Photo (thumbnail)</label><img id="photoPreview" class="photo-preview" alt="Preview"/><input type="file" id="photoInput" accept="image/*"/></div>
<div class="form-group"><label>Name *</label><input type="text" id="itemName" placeholder="e.g. MacBook charger" required/></div>
<div class="form-group"><label>Place</label><div class="chip-list" id="placeChips"></div><span class="add-new" id="addPlaceBtn">+ Add new place</span></div>
<div class="form-group"><label>Tags (categories) *</label><div class="chip-list" id="tagChips"></div><span class="add-new" id="addTagBtn">+ Create new tag</span><div style="font-size:.8rem;color:#888;margin-top:6px">At least one tag is required</div></div>
<div class="form-group"><label>Note</label><textarea id="itemNotes" placeholder="Optional short note..." maxlength="300"></textarea><div class="char-count"><span id="notesCount">0</span>/300</div></div>
<div class="modal-actions"><button class="btn btn-outline" id="cancelBtn">Cancel</button><button class="btn btn-primary" id="saveBtn">Save Item</button></div>
</div>
</div>

<div class="modal-overlay" id="nameModal">
<div class="modal" style="max-width:360px">
<h2 id="nameModalTitle">Add</h2>
<div class="form-group"><input type="text" id="nameModalInput" placeholder="Name" autocomplete="off"/></div>
<div class="modal-actions"><button class="btn btn-outline" id="nameModalCancel">Cancel</button><button class="btn btn-primary" id="nameModalSave">Add</button></div>
</div>
</div>

<div class="modal-overlay" id="confirmModal">
<div class="modal" style="max-width:360px">
<div class="confirm-box"><div class="confirm-title"><span class="confirm-delete">DELETE</span> <span class="confirm-name" id="confirmItemName"></span></div>
<p style="color:#666;font-size:.9rem;margin-bottom:18px">This cannot be undone.</p></div>
<div class="modal-actions"><button class="btn btn-outline" id="confirmCancel">Cancel</button><button class="btn btn-primary" id="confirmDelete" style="background:#c00">Delete</button></div>
</div>
</div>

<div class="toast" id="toast"></div>
<script>
const API="/api";
let state={items:[],places:[],tags:[],categories:["All"],currentTag:"All",search:"",page:1,totalPages:1,editingId:null,selectedPlaceId:null,selectedTags:new Set(),imageKey:null,expandedId:null};
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2200)}
function debounce(fn,ms=300){let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>fn(...a),ms)}}
async function compressImage(file,maxWidth=500,quality=.75){return new Promise(r=>{const rd=new FileReader();rd.onload=e=>{const img=new Image();img.onload=()=>{const c=document.createElement("canvas");let w=img.width,h=img.height;if(w>maxWidth){h=(h*maxWidth)/w;w=maxWidth}c.width=w;c.height=h;c.getContext("2d").drawImage(img,0,0,w,h);c.toBlob(b=>r(b),"image/jpeg",quality)};img.src=e.target.result};rd.readAsDataURL(file)})}
async function fetchItems(){const p=new URLSearchParams({page:state.page,limit:10});if(state.search)p.set("search",state.search);if(state.currentTag&&state.currentTag!=="All")p.set("tag",state.currentTag);const res=await fetch(`${API}/items?${p}`);const data=await res.json();state.items=data.items||[];state.totalPages=data.pagination?.totalPages||1;renderGrid();renderPagination()}
async function fetchPlaces(){const res=await fetch(`${API}/places`);state.places=await res.json();renderPlaceChips()}
async function fetchTags(){const res=await fetch(`${API}/tags`);state.tags=await res.json();renderTagChips()}
async function fetchCategories(){const res=await fetch(`${API}/categories`);const cats=await res.json();state.categories=cats.length?cats:["All"];renderCategories()}
function renderCategories(){document.getElementById("categories").innerHTML=state.categories.map(c=>`<button class="cat-chip ${c===state.currentTag?"active":""}" data-cat="${c}">${c}</button>`).join("")}
function renderPlaceChips(){document.getElementById("placeChips").innerHTML=state.places.map(p=>`<span class="chip ${state.selectedPlaceId==p.id?"selected":""}" data-id="${p.id}">${escapeHtml(p.name)}</span>`).join("")}
function renderTagChips(){document.getElementById("tagChips").innerHTML=state.tags.filter(t=>(t.name||"").toLowerCase()!=="uncategorized").map(t=>`<span class="chip ${state.selectedTags.has(t.id)?"selected":""}" data-id="${t.id}">${escapeHtml(t.name)}</span>`).join("")}
function renderGrid(){const grid=document.getElementById("grid");if(!state.items.length){grid.innerHTML=`<div class="empty" style="grid-column:1/-1"><h3>No items yet</h3><p>Hit the + button and start organizing.</p></div>`;return}
grid.innerHTML=state.items.map(item=>{const exp=state.expandedId===item.id;const img=item.image_url?`<img class="thumb" src="${item.image_url}" alt="${item.name}" loading="lazy"/>`:`<div class="thumb placeholder"></div>`;return`<div class="card ${exp?"expanded":""}" data-id="${item.id}">${img}<div class="card-body"><div class="card-name">${escapeHtml(item.name)}</div><div class="card-place">${escapeHtml(item.place_name||"No place")}</div><div class="card-extra"><div class="tags">${(item.tags||[]).map(t=>`<span class="tag">${escapeHtml(t)}</span>`).join("")||"<span class='meta'>No tags</span>"}</div>${item.notes?`<div class="item-notes">${escapeHtml(item.notes)}</div>`:""}<div class="meta">Updated: ${formatDate(item.updated_at)}</div><div class="btn-row"><button class="btn btn-yellow edit-btn" data-id="${item.id}">Update</button><button class="btn btn-danger delete-btn" data-id="${item.id}" data-name="${escapeHtml(item.name)}" title="Delete">Del</button></div></div></div></div>`}).join("")}
function renderPagination(){const el=document.getElementById("pagination");if(state.totalPages<=1){el.style.display="none";return}el.style.display="flex";el.innerHTML=`<button class="btn btn-outline" id="prevPage" ${state.page<=1?"disabled":""}>Prev</button><span class="page-info">${state.page} / ${state.totalPages}</span><button class="btn btn-outline" id="nextPage" ${state.page>=state.totalPages?"disabled":""}>Next</button>`}
function escapeHtml(s){if(!s)return"";return s.replace(/&/g,"&").replace(/</g,"<").replace(/>/g,">").replace(/"/g,""")}
function formatDate(iso){if(!iso)return"—";return new Date(iso).toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric"})}
function openModal(edit=null){state.editingId=edit?edit.id:null;state.selectedPlaceId=edit?.place_id||null;state.selectedTags=new Set();state.imageKey=edit?.image_key||null;document.getElementById("modalTitle").textContent=edit?"Update Item":"Add Item";document.getElementById("itemName").value=edit?.name||"";const notesEl=document.getElementById("itemNotes");notesEl.value=edit?.notes||"";document.getElementById("notesCount").textContent=notesEl.value.length;document.getElementById("photoPreview").classList.remove("show");document.getElementById("photoInput").value="";if(edit?.image_url){const p=document.getElementById("photoPreview");p.src=edit.image_url;p.classList.add("show")}if(edit?.tags)edit.tags.forEach(n=>{if((n||"").toLowerCase()==="uncategorized")return;const f=state.tags.find(t=>t.name===n);if(f)state.selectedTags.add(f.id)});renderPlaceChips();renderTagChips();document.getElementById("modal").classList.add("open")}
function closeModal(){document.getElementById("modal").classList.remove("open");state.editingId=null;state.imageKey=null}
document.getElementById("fab").addEventListener("click",()=>openModal());
document.getElementById("cancelBtn").addEventListener("click",closeModal);
document.getElementById("modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal()});
document.getElementById("categories").addEventListener("click",e=>{if(e.target.classList.contains("cat-chip")){state.currentTag=e.target.dataset.cat;state.page=1;renderCategories();fetchItems()}});
document.getElementById("search").addEventListener("input",debounce(e=>{state.search=e.target.value.trim();state.page=1;fetchItems()},350));
document.getElementById("grid").addEventListener("click",e=>{const card=e.target.closest(".card");if(!card)return;const id=parseInt(card.dataset.id);const del=e.target.closest(".delete-btn");if(del){openConfirmDelete(parseInt(del.dataset.id),del.dataset.name||"this item");return}if(e.target.classList.contains("edit-btn")||e.target.closest(".edit-btn")){openModal(state.items.find(i=>i.id===id));return}state.expandedId=state.expandedId===id?null:id;renderGrid()});
document.getElementById("pagination").addEventListener("click",e=>{if(e.target.id==="prevPage"&&state.page>1){state.page--;fetchItems()}if(e.target.id==="nextPage"&&state.page<state.totalPages){state.page++;fetchItems()}});
document.getElementById("placeChips").addEventListener("click",e=>{if(e.target.classList.contains("chip")){const id=parseInt(e.target.dataset.id);state.selectedPlaceId=state.selectedPlaceId===id?null:id;renderPlaceChips()}});
document.getElementById("tagChips").addEventListener("click",e=>{if(e.target.classList.contains("chip")){const id=parseInt(e.target.dataset.id);if(state.selectedTags.has(id))state.selectedTags.delete(id);else state.selectedTags.add(id);renderTagChips()}});
document.getElementById("photoInput").addEventListener("change",async e=>{const f=e.target.files[0];if(!f)return;const blob=await compressImage(f);const p=document.getElementById("photoPreview");p.src=URL.createObjectURL(blob);p.classList.add("show");p._blob=blob});
document.getElementById("itemNotes").addEventListener("input",e=>{document.getElementById("notesCount").textContent=e.target.value.length});
let nameModalMode=null;
function openNameModal(mode){nameModalMode=mode;document.getElementById("nameModalTitle").textContent=mode==="place"?"New place":"New tag";document.getElementById("nameModalInput").value="";document.getElementById("nameModal").classList.add("open");setTimeout(()=>document.getElementById("nameModalInput").focus(),50)}
function closeNameModal(){document.getElementById("nameModal").classList.remove("open");nameModalMode=null}
document.getElementById("addPlaceBtn").addEventListener("click",()=>openNameModal("place"));
document.getElementById("addTagBtn").addEventListener("click",()=>openNameModal("tag"));
document.getElementById("nameModalCancel").addEventListener("click",closeNameModal);
document.getElementById("nameModal").addEventListener("click",e=>{if(e.target.id==="nameModal")closeNameModal()});
document.getElementById("nameModalInput").addEventListener("keydown",e=>{if(e.key==="Enter")document.getElementById("nameModalSave").click()});
document.getElementById("nameModalSave").addEventListener("click",async()=>{const name=document.getElementById("nameModalInput").value.trim();if(!name){toast("Name is required");return}const btn=document.getElementById("nameModalSave");btn.disabled=true;try{if(nameModalMode==="place"){const res=await fetch(`${API}/places`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name})});if(res.ok){const c=await res.json();state.selectedPlaceId=c.id;await fetchPlaces();toast("Place added");closeNameModal()}else{const err=await res.json().catch(()=>({}));toast(err.error||"Could not add place")}}else if(nameModalMode==="tag"){const res=await fetch(`${API}/tags`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name})});if(res.ok){const t=await res.json();state.selectedTags.add(t.id);await fetchTags();await fetchCategories();toast("Tag created");closeNameModal()}else{const err=await res.json().catch(()=>({}));toast(err.error||"Could not create tag")}}}finally{btn.disabled=false}});
let pendingDeleteId=null;
function openConfirmDelete(id,name){pendingDeleteId=id;document.getElementById("confirmItemName").textContent=name;document.getElementById("confirmModal").classList.add("open")}
function closeConfirm(){document.getElementById("confirmModal").classList.remove("open");pendingDeleteId=null}
document.getElementById("confirmCancel").addEventListener("click",closeConfirm);
document.getElementById("confirmModal").addEventListener("click",e=>{if(e.target.id==="confirmModal")closeConfirm()});
document.getElementById("confirmDelete").addEventListener("click",async()=>{if(!pendingDeleteId)return;const btn=document.getElementById("confirmDelete");btn.disabled=true;try{const res=await fetch(`${API}/items/${pendingDeleteId}`,{method:"DELETE"});if(res.ok){toast("Item deleted");closeConfirm();if(state.expandedId===pendingDeleteId)state.expandedId=null;await fetchItems()}else toast("Delete failed")}catch(e){toast("Network error")}finally{btn.disabled=false}});
document.getElementById("saveBtn").addEventListener("click",async()=>{const name=document.getElementById("itemName").value.trim();if(!name){toast("Name is required");return}if(state.selectedTags.size===0){toast("Select at least one tag (category)");return}const saveBtn=document.getElementById("saveBtn");saveBtn.disabled=true;saveBtn.textContent="Saving...";try{let imageKey=state.imageKey;const prev=document.getElementById("photoPreview");if(prev._blob){const form=new FormData();form.append("file",prev._blob,"thumb.jpg");const up=await fetch(`${API}/upload`,{method:"POST",body:form});if(up.ok){const d=await up.json();imageKey=d.key}}const notes=document.getElementById("itemNotes").value.trim().slice(0,300);const payload={name,place_id:state.selectedPlaceId||null,tags:Array.from(state.selectedTags),image_key:imageKey,notes:notes||null};const url=state.editingId?`${API}/items/${state.editingId}`:`${API}/items`;const method=state.editingId?"PUT":"POST";const res=await fetch(url,{method,headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});if(res.ok){toast(state.editingId?"Updated!":"Item added!");closeModal();await fetchCategories();await fetchItems()}else{const err=await res.json();toast(err.error||"Save failed")}}catch(e){console.error(e);toast("Network error")}finally{saveBtn.disabled=false;saveBtn.textContent="Save Item"}});
async function init(){await Promise.all([fetchPlaces(),fetchTags(),fetchCategories(),fetchItems()])}
init();
</script>
</body>
</html>
