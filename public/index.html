<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
  <title>MyItem – Find Your Stuff Fast</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0f5ff', 100: '#e5edff', 500: '#0284c7', 600: '#0058A3', 700: '#0047a5',
              accent: '#FFDA1A', accentHover: '#eab308',
            }
          },
          fontFamily: { sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'] }
        }
      }
    }
  </script>
  <link href="https://fonts.googleapis.com" rel="preconnect"/>
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .item-card { transition: all 0.22s cubic-bezier(0.16, 1, 0.3, 1); cursor: pointer; }
    .item-card:hover { transform: translateY(-3px); box-shadow: 0 12px 24px -10px rgba(15, 23, 42, 0.12), 0 4px 6px -2px rgba(15, 23, 42, 0.04); }
    .img-zoom { transition: transform 0.35s ease; }
    .item-card:hover .img-zoom { transform: scale(1.035); }
    .card-actions { max-width: 0; overflow: hidden; opacity: 0; transition: all 0.3s ease; }
    .item-card.expanded .card-actions, .item-card:hover .card-actions { max-width: 100px; opacity: 1; }
    
    .modal-overlay { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.6); z-index: 100; display: none; align-items: flex-end; justify-content: center; backdrop-filter: blur(2px); }
    @media(min-width:600px){ .modal-overlay { align-items: center; } }
    .modal-overlay.open { display: flex; }
    .toast { position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%); background: #1e293b; color: #fff; padding: 12px 22px; border-radius: 99px; font-size: 0.9rem; z-index: 200; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
    .toast.show { opacity: 1; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen flex flex-col selection:bg-brand-accent selection:text-slate-900 pb-24">

<header class="sticky top-0 z-40 bg-white border-b border-slate-200/90 shadow-sm backdrop-blur-md bg-white/95">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex items-center justify-between h-16 gap-4">
      <div class="flex items-center space-x-3 shrink-0">
        <a class="flex items-center gap-2.5 group" href="/">
          <img src="/api/images/88fb26bb-bec6-4a7c-8d2a-0033ff74006e.jpg" alt="MyItem Logo" class="h-9 w-auto rounded-xl object-cover group-hover:scale-105 transition-transform shadow-sm" />
          <div class="hidden sm:flex items-baseline">
            <span class="text-xl font-bold tracking-tight text-slate-900">My<span class="text-brand-600">Item</span></span>
            <span class="w-1.5 h-1.5 rounded-full bg-brand-accent ml-0.5 inline-block"></span>
          </div>
        </a>
      </div>
      <div class="flex-1 max-w-2xl px-2">
        <div class="relative w-full">
          <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" x2="16.65" y1="21" y2="16.65"></line></svg>
          </div>
          <input id="search" class="w-full pl-10 pr-4 py-2 bg-slate-100 hover:bg-slate-100/90 focus:bg-white text-sm text-slate-800 placeholder-slate-400 rounded-full border border-transparent focus:border-brand-500 focus:ring-2 focus:ring-brand-500/20 transition-all outline-none" placeholder="Search items, places, tags..." type="text" autocomplete="off"/>
        </div>
      </div>
      <div class="flex items-center space-x-2 shrink-0">
        <button id="btnAddTop" class="hidden md:inline-flex items-center gap-1.5 px-3.5 py-1.5 text-xs font-semibold text-slate-900 bg-brand-accent hover:bg-brand-accentHover rounded-lg shadow-sm hover:shadow transition">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path d="M12 4v16m8-8H4" stroke-linecap="round" stroke-linejoin="round"></path></svg>
          <span>Add Item</span>
        </button>
        <a href="/manage.html" class="h-8 w-8 rounded-full bg-slate-900 text-white flex items-center justify-center font-medium text-xs ring-2 ring-slate-100 ring-offset-1 hover:bg-slate-800 transition">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        </a>
      </div>
    </div>
  </div>
</header>

<section class="bg-white border-b border-slate-200/80 py-3.5">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex items-center gap-2 overflow-x-auto no-scrollbar pb-1 pt-0.5" id="categories">
    </div>
    <div class="flex flex-col sm:flex-row sm:items-center justify-between pt-3 text-xs text-slate-500 gap-2">
      <div class="flex items-center gap-1.5" id="filterMeta">
      </div>
    </div>
  </div>
</section>

<main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">
  <div id="grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-5 sm:gap-6">
    <div class="col-span-full text-center py-12 text-slate-500">Loading your items...</div>
  </div>
  <div class="flex justify-center items-center gap-3 mt-8" id="pagination" style="display:none"></div>
</main>

<button id="fab" class="fixed bottom-6 right-6 z-50 w-14 h-14 rounded-full bg-brand-accent hover:bg-brand-accentHover text-slate-900 shadow-lg hover:shadow-xl flex items-center justify-center active:scale-95 transition-all focus:outline-none focus:ring-4 focus:ring-brand-accent/40">
  <svg class="w-7 h-7 stroke-slate-950" fill="none" stroke="currentColor" stroke-width="2.6" viewBox="0 0 24 24"><path d="M12 4.5v15m7.5-7.5h-15" stroke-linecap="round" stroke-linejoin="round"></path></svg>
</button>

<!-- Add/Edit Modal -->
<div class="modal-overlay" id="modal">
  <div class="bg-white w-full max-w-lg rounded-t-2xl sm:rounded-2xl p-6 max-h-[90vh] overflow-y-auto shadow-xl">
    <h2 id="modalTitle" class="text-xl font-bold text-brand-700 mb-5">Add Item</h2>
    <div class="mb-4">
      <label class="block text-sm font-semibold text-slate-700 mb-2">Photo (thumbnail)</label>
      <img id="photoPreview" class="hidden w-28 h-28 rounded-xl object-cover bg-slate-100 mb-2 border border-slate-200" alt="Preview"/>
      <input type="file" id="photoInput" accept="image/*" class="w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-brand-50 file:text-brand-700 hover:file:bg-brand-100 cursor-pointer"/>
    </div>
    <div class="mb-4">
      <label class="block text-sm font-semibold text-slate-700 mb-2">Name *</label>
      <input type="text" id="itemName" placeholder="e.g. MacBook charger" required class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:border-brand-500 focus:ring-2 focus:ring-brand-500/20 outline-none transition"/>
    </div>
    <div class="mb-4">
      <label class="block text-sm font-semibold text-slate-700 mb-2">Place</label>
      <div class="flex flex-wrap gap-2 mb-2" id="placeChips"></div>
      <button class="text-brand-600 font-medium text-sm hover:underline" id="addPlaceBtn" type="button">+ Add new place</button>
    </div>
    <div class="mb-4">
      <label class="block text-sm font-semibold text-slate-700 mb-2">Tags (categories) * <span class="font-normal text-slate-400">max 3</span></label>
      <div class="flex flex-wrap gap-2 mb-2" id="tagChips"></div>
      <button class="text-brand-600 font-medium text-sm hover:underline" id="addTagBtn" type="button">+ Create new tag</button>
    </div>
    <div class="mb-6">
      <label class="block text-sm font-semibold text-slate-700 mb-2">Note</label>
      <textarea id="itemNotes" placeholder="Optional short note..." maxlength="300" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:border-brand-500 focus:ring-2 focus:ring-brand-500/20 outline-none transition min-h-[80px] resize-y"></textarea>
      <div class="text-xs text-slate-400 text-right mt-1"><span id="notesCount">0</span>/300</div>
    </div>
    <div class="flex gap-3 pt-2">
      <button class="flex-1 py-3 rounded-xl font-bold text-slate-700 bg-slate-100 hover:bg-slate-200 transition" id="cancelBtn" type="button">Cancel</button>
      <button class="flex-1 py-3 rounded-xl font-bold text-white bg-brand-600 hover:bg-brand-700 transition" id="saveBtn" type="button">Save Item</button>
    </div>
  </div>
</div>

<!-- Name Modal -->
<div class="modal-overlay" id="nameModal">
  <div class="bg-white w-full max-w-sm rounded-t-2xl sm:rounded-2xl p-6 shadow-xl">
    <h2 id="nameModalTitle" class="text-lg font-bold text-brand-700 mb-4">Add</h2>
    <input type="text" id="nameModalInput" placeholder="Name" autocomplete="off" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:border-brand-500 focus:ring-2 focus:ring-brand-500/20 outline-none transition mb-6"/>
    <div class="flex gap-3">
      <button class="flex-1 py-2.5 rounded-xl font-bold text-slate-700 bg-slate-100 hover:bg-slate-200 transition" id="nameModalCancel" type="button">Cancel</button>
      <button class="flex-1 py-2.5 rounded-xl font-bold text-white bg-brand-600 hover:bg-brand-700 transition" id="nameModalSave" type="button">Add</button>
    </div>
  </div>
</div>

<!-- Confirm Modal -->
<div class="modal-overlay" id="confirmModal">
  <div class="bg-white w-full max-w-sm rounded-t-2xl sm:rounded-2xl p-6 shadow-xl text-center">
    <h2 class="text-lg mb-2 leading-snug"><span class="text-red-600 font-black">DELETE</span> <span class="font-bold text-slate-800" id="confirmItemName"></span></h2>
    <p class="text-sm text-slate-500 mb-6">This cannot be undone.</p>
    <div class="flex gap-3">
      <button class="flex-1 py-2.5 rounded-xl font-bold text-slate-700 bg-slate-100 hover:bg-slate-200 transition" id="confirmCancel" type="button">Cancel</button>
      <button class="flex-1 py-2.5 rounded-xl font-bold text-white bg-red-600 hover:bg-red-700 transition" id="confirmDelete" type="button">Delete</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API="/api";
const MAX_TAGS=3;
let state={items:[],places:[],tags:[],categories:["All"],currentTag:"All",search:"",page:1,totalPages:1,total:0,editingId:null,selectedPlaceId:null,selectedTags:new Set(),imageKey:null};
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("show");setTimeout(function(){t.classList.remove("show")},2200)}
function debounce(fn,ms){var t;return function(){var a=arguments,c=this;clearTimeout(t);t=setTimeout(function(){fn.apply(c,a)},ms)}}
function escapeHtml(s){if(!s)return"";return String(s).replace(/&/g,"&"+"amp;").replace(/</g,"&"+"lt;").replace(/>/g,"&"+"gt;").replace(/"/g,"&"+"quot;")}
function formatDateTime(iso){if(!iso)return{date:"-",time:""};var d=new Date(iso);var dt=d.toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric"});var tm=d.toLocaleTimeString(undefined,{hour:"2-digit",minute:"2-digit"});return{date:dt,time:tm}}
async function compressImage(file,maxWidth,quality){maxWidth=maxWidth||500;quality=quality||0.75;return new Promise(function(resolve){var rd=new FileReader();rd.onload=function(e){var img=new Image();img.onload=function(){var c=document.createElement("canvas");var w=img.width,h=img.height;if(w>maxWidth){h=(h*maxWidth)/w;w=maxWidth}c.width=w;c.height=h;c.getContext("2d").drawImage(img,0,0,w,h);c.toBlob(function(b){resolve(b)},"image/jpeg",quality)};img.src=e.target.result};rd.readAsDataURL(file)})}
async function fetchItems(){var p=new URLSearchParams({page:String(state.page),limit:"10"});if(state.search)p.set("search",state.search);if(state.currentTag&&state.currentTag!=="All")p.set("tag",state.currentTag);var res=await fetch(API+"/items?"+p.toString());var data=await res.json();state.items=data.items||[];state.totalPages=(data.pagination&&data.pagination.totalPages)||1;state.total=(data.pagination&&data.pagination.total)||0;renderGrid();renderPagination();renderFilterMeta()}
async function fetchPlaces(){var res=await fetch(API+"/places");state.places=await res.json();renderPlaceChips()}
async function fetchTags(){var res=await fetch(API+"/tags");state.tags=await res.json();renderTagChips()}
async function fetchCategories(){var res=await fetch(API+"/categories");var cats=await res.json();if(cats.length){var idx=cats.findIndex(function(c){return c.toLowerCase()==="uncategorized"});if(idx!==-1){var u=cats.splice(idx,1)[0];cats.push(u)}state.categories=cats}else{state.categories=["All"]}renderCategories()}
function renderCategories(){
  let html = state.categories.map(function(c){
    let isActive = c === state.currentTag;
    let baseCls = "shrink-0 inline-flex items-center px-3.5 py-1.5 rounded-full text-xs font-medium transition cursor-pointer ";
    if (isActive) {
      baseCls += "bg-brand-accent text-slate-900 shadow-sm font-semibold";
    } else {
      baseCls += "text-slate-600 hover:text-slate-900 bg-white border border-slate-200 hover:border-slate-300 hover:bg-slate-50";
    }
    return "<button class=\""+baseCls+" cat-chip\" data-cat=\""+escapeHtml(c)+"\">"+escapeHtml(c)+"</button>";
  }).join("");
  html += `<button id="addTagBtnHome" class="shrink-0 inline-flex items-center gap-1 px-3 py-1.5 rounded-full text-xs font-medium text-slate-500 hover:text-slate-800 border border-dashed border-slate-300 hover:border-slate-400 hover:bg-white transition cursor-pointer"><svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 4v16m8-8H4" stroke-linecap="round" stroke-linejoin="round"></path></svg><span>Category</span></button>`;
  document.getElementById("categories").innerHTML = html;
  document.getElementById("addTagBtnHome").addEventListener("click", function(){ openNameModal("tag"); });
}
function renderFilterMeta(){
  var el=document.getElementById("filterMeta");
  var count=state.total;
  var label=count===1?"1 tracked item":count+" tracked items";
  if(state.currentTag&&state.currentTag!=="All"){
    el.innerHTML="<span class=\"font-medium text-slate-700\">"+label+"</span><span>•</span><span>Filtered by: <span class=\"font-medium text-slate-600\">"+escapeHtml(state.currentTag)+"</span></span>";
  } else if(state.search){
    el.innerHTML="<span class=\"font-medium text-slate-700\">"+label+"</span><span>•</span><span>Search: <span class=\"font-medium text-slate-600\">"+escapeHtml(state.search)+"</span></span>";
  } else {
    el.innerHTML="<span class=\"font-medium text-slate-700\">"+label+"</span>";
  }
}
function renderPlaceChips(){
  document.getElementById("placeChips").innerHTML=state.places.map(function(p){
    let sel = state.selectedPlaceId == p.id;
    let cls = sel ? "bg-brand-100 text-brand-700 border-brand-500 font-semibold" : "bg-slate-100 text-slate-600 border-transparent hover:bg-slate-200";
    return `<span class="px-3 py-1.5 rounded-full text-sm cursor-pointer border-2 transition ${cls} chip" data-id="${p.id}">${escapeHtml(p.name)}</span>`;
  }).join("");
}
function renderTagChips(){
  var atMax=state.selectedTags.size>=MAX_TAGS;
  document.getElementById("tagChips").innerHTML=state.tags.filter(t => (t.name||"").toLowerCase()!=="uncategorized").map(function(t){
    let sel = state.selectedTags.has(t.id);
    let disabled = atMax && !sel;
    let cls = sel ? "bg-brand-100 text-brand-700 border-brand-500 font-semibold" : "bg-slate-100 text-slate-600 border-transparent hover:bg-slate-200";
    if (disabled) cls += " opacity-40 cursor-not-allowed";
    return `<span class="px-3 py-1.5 rounded-full text-sm cursor-pointer border-2 transition ${cls} chip ${disabled?'disabled':''}" data-id="${t.id}">${escapeHtml(t.name)}</span>`;
  }).join("");
}
function renderGrid(){
  var grid=document.getElementById("grid");
  if(!state.items.length){
    grid.innerHTML="<div class=\"col-span-full text-center py-12 text-slate-500\"><h3>No items yet</h3><p>Click + Add Item to start organizing.</p></div>";
    return;
  }
  var pencil=`<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" stroke-linecap="round" stroke-linejoin="round"></path></svg>`;
  var trash=`<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>`;
  grid.innerHTML=state.items.map(function(item){
    var dt=formatDateTime(item.updated_at);
    var imgHtml = item.image_url 
      ? `<img src="${item.image_url}" alt="${escapeHtml(item.name)}" class="w-full h-full object-cover img-zoom" loading="lazy" />`
      : `<div class="w-full h-full flex items-center justify-center bg-gradient-to-br from-slate-100 to-slate-200 text-slate-400"><svg class="w-14 h-14 text-slate-300 group-hover:scale-110 transition-transform" fill="none" stroke="currentColor" stroke-width="1.3" viewBox="0 0 24 24"><path d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" stroke-linecap="round" stroke-linejoin="round"></path></svg></div>`;
    var tags = (item.tags||[]).filter(t => (t||"").toLowerCase()!=="uncategorized").slice(0, 3);
    var tagHtml = tags.map(t => `<span class="px-2 py-0.5 rounded-md text-[11px] font-semibold bg-white/90 backdrop-blur-sm text-slate-800 shadow-sm border border-white/40">${escapeHtml(t)}</span>`).join("");
    var placeName = item.place_name ? escapeHtml(item.place_name) : "Place deleted";
    var placeIcon = `<svg class="w-3.5 h-3.5 text-brand-500 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" stroke-linecap="round" stroke-linejoin="round"></path><path d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" stroke-linecap="round" stroke-linejoin="round"></path></svg>`;
    var notes = item.notes ? `<p class="text-[11px] text-slate-400 mt-0.5 line-clamp-2">${escapeHtml(item.notes)}</p>` : "";
    return `
    <article class="card item-card bg-white rounded-2xl border border-slate-200/90 overflow-hidden shadow-sm flex flex-col group relative" data-id="${item.id}">
      <div class="relative w-full aspect-square sm:aspect-[4/3] bg-slate-100 overflow-hidden shrink-0">
        ${imgHtml}
        <div class="absolute top-2.5 left-2.5 flex flex-wrap gap-1.5 z-10">${tagHtml}</div>
      </div>
      <div class="p-4 flex-1 flex flex-col justify-between">
        <div>
          <h3 class="font-semibold text-slate-900 text-sm leading-snug group-hover:text-brand-600 transition-colors line-clamp-2">${escapeHtml(item.name)}</h3>
          ${notes}
          <div class="mt-3 flex items-center gap-1.5 text-xs text-slate-600 bg-slate-50 px-2.5 py-1.5 rounded-lg border border-slate-100">
            ${placeIcon}
            <span class="font-medium text-slate-700 truncate">${placeName}</span>
          </div>
        </div>
        <div class="mt-4 pt-3 border-t border-slate-100 flex items-end justify-between">
          <div class="card-actions flex gap-1.5">
            <button class="edit-btn p-1.5 rounded-lg bg-brand-accent text-brand-700 hover:bg-brand-accentHover transition" data-id="${item.id}" title="Edit">${pencil}</button>
            <button class="delete-btn p-1.5 rounded-lg bg-red-50 text-red-600 hover:bg-red-100 transition" data-id="${item.id}" data-name="${escapeHtml(item.name)}" title="Delete">${trash}</button>
          </div>
          <div class="text-[11px] text-slate-400 text-right flex flex-col">
            <span class="font-semibold text-slate-500">${dt.date}</span>
            <span>${dt.time}</span>
          </div>
        </div>
      </div>
    </article>
    `;
  }).join("");
}
function renderPagination(){
  var el=document.getElementById("pagination");
  if(state.totalPages<=1){el.style.display="none";return}
  el.style.display="flex";
  var prevDis=state.page<=1?" opacity-40 cursor-not-allowed":"";
  var nextDis=state.page>=state.totalPages?" opacity-40 cursor-not-allowed":"";
  el.innerHTML=`<button class="px-4 py-2 bg-white border border-slate-200 rounded-lg text-sm font-semibold text-slate-700 ${prevDis}" id="prevPage">Prev</button>
  <span class="text-sm font-semibold text-slate-500">${state.page} / ${state.totalPages}</span>
  <button class="px-4 py-2 bg-white border border-slate-200 rounded-lg text-sm font-semibold text-slate-700 ${nextDis}" id="nextPage">Next</button>`;
}
function openModal(edit){state.editingId=edit?edit.id:null;state.selectedPlaceId=edit&&edit.place_id?edit.place_id:null;state.selectedTags=new Set();state.imageKey=edit&&edit.image_key?edit.image_key:null;document.getElementById("modalTitle").textContent=edit?"Update Item":"Add Item";document.getElementById("itemName").value=edit&&edit.name?edit.name:"";var notesEl=document.getElementById("itemNotes");notesEl.value=edit&&edit.notes?edit.notes:"";document.getElementById("notesCount").textContent=String(notesEl.value.length);document.getElementById("photoPreview").classList.remove("show");document.getElementById("photoInput").value="";if(edit&&edit.image_url){var p=document.getElementById("photoPreview");p.src=edit.image_url;p.classList.add("show")}if(edit&&edit.tags){edit.tags.forEach(function(n){if((n||"").toLowerCase()==="uncategorized")return;var f=state.tags.find(function(t){return t.name===n});if(f&&state.selectedTags.size<MAX_TAGS)state.selectedTags.add(f.id)})}renderPlaceChips();renderTagChips();document.getElementById("modal").classList.add("open")}
function closeModal(){document.getElementById("modal").classList.remove("open");state.editingId=null;state.imageKey=null}
document.getElementById("fab").addEventListener("click",function(){openModal(null)});
document.getElementById("btnAddTop").addEventListener("click",function(){openModal(null)});
document.getElementById("cancelBtn").addEventListener("click",closeModal);
document.getElementById("modal").addEventListener("click",function(e){if(e.target.id==="modal")closeModal()});
document.getElementById("categories").addEventListener("click",function(e){if(e.target.classList.contains("cat-chip")){state.currentTag=e.target.getAttribute("data-cat");state.page=1;renderCategories();fetchItems()}});
document.getElementById("search").addEventListener("input",debounce(function(e){state.search=e.target.value.trim();state.page=1;fetchItems()},350));
document.getElementById("grid").addEventListener("click",function(e){var del=e.target.closest(".delete-btn");if(del){openConfirmDelete(parseInt(del.getAttribute("data-id"),10),del.getAttribute("data-name")||"this item");return}var edit=e.target.closest(".edit-btn");if(edit){var id=parseInt(edit.getAttribute("data-id"),10);openModal(state.items.find(function(i){return i.id===id}));return}var card=e.target.closest(".card");if(card){document.querySelectorAll(".card.expanded").forEach(function(c){if(c!==card)c.classList.remove("expanded")});card.classList.toggle("expanded")}});
document.getElementById("pagination").addEventListener("click",function(e){if(e.target.id==="prevPage"&&state.page>1){state.page--;fetchItems()}if(e.target.id==="nextPage"&&state.page<state.totalPages){state.page++;fetchItems()}});
document.getElementById("placeChips").addEventListener("click",function(e){if(e.target.classList.contains("chip")){var id=parseInt(e.target.getAttribute("data-id"),10);state.selectedPlaceId=state.selectedPlaceId===id?null:id;renderPlaceChips()}});
document.getElementById("tagChips").addEventListener("click",function(e){if(!e.target.classList.contains("chip")||e.target.classList.contains("disabled"))return;var id=parseInt(e.target.getAttribute("data-id"),10);if(state.selectedTags.has(id)){state.selectedTags.delete(id)}else if(state.selectedTags.size<MAX_TAGS){state.selectedTags.add(id)}else{toast("Maximum "+MAX_TAGS+" tags");return}renderTagChips()});
document.getElementById("photoInput").addEventListener("change",async function(e){var f=e.target.files[0];if(!f)return;var blob=await compressImage(f);var p=document.getElementById("photoPreview");p.src=URL.createObjectURL(blob);p.classList.add("show");p._blob=blob});
document.getElementById("itemNotes").addEventListener("input",function(e){document.getElementById("notesCount").textContent=String(e.target.value.length)});
var nameModalMode=null;
function openNameModal(mode){nameModalMode=mode;document.getElementById("nameModalTitle").textContent=mode==="place"?"New place":"New tag";document.getElementById("nameModalInput").value="";document.getElementById("nameModal").classList.add("open");setTimeout(function(){document.getElementById("nameModalInput").focus()},50)}
function closeNameModal(){document.getElementById("nameModal").classList.remove("open");nameModalMode=null}
document.getElementById("addPlaceBtn").addEventListener("click",function(){openNameModal("place")});
document.getElementById("addTagBtn").addEventListener("click",function(){openNameModal("tag")});
document.getElementById("nameModalCancel").addEventListener("click",closeNameModal);
document.getElementById("nameModal").addEventListener("click",function(e){if(e.target.id==="nameModal")closeNameModal()});
document.getElementById("nameModalInput").addEventListener("keydown",function(e){if(e.key==="Enter")document.getElementById("nameModalSave").click()});
document.getElementById("nameModalSave").addEventListener("click",async function(){var name=document.getElementById("nameModalInput").value.trim();if(!name){toast("Name is required");return}var btn=document.getElementById("nameModalSave");btn.disabled=true;try{if(nameModalMode==="place"){var res=await fetch(API+"/places",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:name})});if(res.ok){var c=await res.json();state.selectedPlaceId=c.id;await fetchPlaces();toast("Place added");closeNameModal()}else{var err=await res.json().catch(function(){return{}});toast(err.error||"Could not add place")}}else if(nameModalMode==="tag"){if(state.selectedTags.size>=MAX_TAGS){toast("Maximum "+MAX_TAGS+" tags");return}var res2=await fetch(API+"/tags",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:name})});if(res2.ok){var t=await res2.json();state.selectedTags.add(t.id);await fetchTags();await fetchCategories();toast("Tag created");closeNameModal()}else{var err2=await res2.json().catch(function(){return{}});toast(err2.error||"Could not create tag")}}}finally{btn.disabled=false}});
var pendingDeleteId=null;
function openConfirmDelete(id,name){pendingDeleteId=id;document.getElementById("confirmItemName").textContent=name;document.getElementById("confirmModal").classList.add("open")}
function closeConfirm(){document.getElementById("confirmModal").classList.remove("open");pendingDeleteId=null}
document.getElementById("confirmCancel").addEventListener("click",closeConfirm);
document.getElementById("confirmModal").addEventListener("click",function(e){if(e.target.id==="confirmModal")closeConfirm()});
document.getElementById("confirmDelete").addEventListener("click",async function(){if(!pendingDeleteId)return;var btn=document.getElementById("confirmDelete");btn.disabled=true;try{var res=await fetch(API+"/items/"+pendingDeleteId,{method:"DELETE"});if(res.ok){toast("Item deleted");closeConfirm();await fetchItems()}else toast("Delete failed")}catch(e){toast("Network error")}finally{btn.disabled=false}});
document.getElementById("saveBtn").addEventListener("click",async function(){var name=document.getElementById("itemName").value.trim();if(!name){toast("Name is required");return}if(state.selectedTags.size===0){toast("Select at least one tag (category)");return}if(state.selectedTags.size>MAX_TAGS){toast("Maximum "+MAX_TAGS+" tags");return}var saveBtn=document.getElementById("saveBtn");saveBtn.disabled=true;saveBtn.textContent="Saving...";try{var imageKey=state.imageKey;var prev=document.getElementById("photoPreview");if(prev._blob){var form=new FormData();form.append("file",prev._blob,"thumb.jpg");var up=await fetch(API+"/upload",{method:"POST",body:form});if(up.ok){var d=await up.json();imageKey=d.key}}var notes=document.getElementById("itemNotes").value.trim().slice(0,300);var payload={name:name,place_id:state.selectedPlaceId||null,tags:Array.from(state.selectedTags).slice(0,MAX_TAGS),image_key:imageKey,notes:notes||null};var url=state.editingId?API+"/items/"+state.editingId:API+"/items";var method=state.editingId?"PUT":"POST";var res=await fetch(url,{method:method,headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});if(res.ok){toast(state.editingId?"Updated!":"Item added!");closeModal();await fetchCategories();await fetchItems()}else{var err=await res.json();toast(err.error||"Save failed")}}catch(e){console.error(e);toast("Network error")}finally{saveBtn.disabled=false;saveBtn.textContent="Save Item"}});
async function init(){await Promise.all([fetchPlaces(),fetchTags(),fetchCategories(),fetchItems()])}
init();
</script>
</body>
</html>
