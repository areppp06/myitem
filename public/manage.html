<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manage – MyItem</title>
  <meta name="theme-color" content="#0058A3" />
  <style>
    :root { --ikea-yellow: #FFDA1A; --ikea-blue: #0058A3; --bg: #f5f5f5; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: #111; min-height: 100vh; }
    header { background: var(--ikea-blue); color: white; padding: 16px; display: flex; align-items: center; gap: 12px; }
    header a { color: white; text-decoration: none; font-weight: 600; font-size: 0.95rem; }
    header h1 { font-size: 1.2rem; }
    .container { max-width: 700px; margin: 0 auto; padding: 20px 16px; }
    .section { background: white; border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    .section h2 { font-size: 1.1rem; color: var(--ikea-blue); margin-bottom: 14px; display: flex; align-items: center; gap: 6px; }
    .list { list-style: none; }
    .list li { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #eee; gap: 8px; }
    .list li:last-child { border-bottom: none; }
    .list li .name { flex: 1; font-weight: 500; }
    .list li .name.system { color: #888; font-style: italic; }
    .actions { display: flex; gap: 6px; flex-shrink: 0; }
    .btn { padding: 6px 10px; border-radius: 6px; border: none; font-weight: 600; font-size: 0.8rem; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
    .btn-icon { background: #f5f5f5; color: #333; width: 32px; height: 32px; padding: 0; }
    .btn-icon:hover { background: #e8e8e8; }
    .btn-del { background: #fee; color: #c00; width: 32px; height: 32px; padding: 0; }
    .btn-del:hover { background: #fcc; }
    .btn-add { background: var(--ikea-yellow); color: var(--ikea-blue); padding: 10px 16px; }
    .add-row { display: flex; gap: 8px; margin-top: 12px; }
    .add-row input { flex: 1; padding: 10px 12px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 15px; outline: none; }
    .add-row input:focus { border-color: var(--ikea-blue); }
    .empty { color: #888; font-size: 0.9rem; }
    .hint { font-size: 0.8rem; color: #888; margin-top: 8px; }
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 100; display: none; align-items: center; justify-content: center; }
    .modal-overlay.open { display: flex; }
    .modal { background: white; width: 90%; max-width: 360px; border-radius: 16px; padding: 24px 20px; }
    .modal h3 { margin-bottom: 14px; color: var(--ikea-blue); }
    .modal input { width: 100%; padding: 12px; border: 2px solid #e0e0e0; border-radius: 10px; font-size: 16px; margin-bottom: 16px; outline: none; }
    .modal input:focus { border-color: var(--ikea-blue); }
    .modal-actions { display: flex; gap: 10px; }
    .modal-actions button { flex: 1; padding: 12px; border-radius: 8px; border: none; font-weight: 700; cursor: pointer; }
    .btn-cancel { background: #f0f0f0; color: #333; }
    .btn-save { background: var(--ikea-blue); color: white; }
    .btn-danger-full { background: #c00; color: white; }
    .confirm-text { margin-bottom: 16px; line-height: 1.4; }
    .confirm-text .del-word { color: #c00; font-weight: 800; font-size: 1.1rem; }
    .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #222; color: white; padding: 12px 20px; border-radius: 999px; font-size: 0.9rem; z-index: 200; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>
  <header>
    <a href="/">Back</a>
    <h1>Manage Places & Tags</h1>
  </header>
  <div class="container">
    <div class="section">
      <h2>Places</h2>
      <ul class="list" id="placeList"><li class="empty">Loading...</li></ul>
      <div class="add-row">
        <input type="text" id="newPlace" placeholder="New place name" />
        <button class="btn btn-add" id="addPlace">Add</button>
      </div>
    </div>
    <div class="section">
      <h2>Tags (categories)</h2>
      <ul class="list" id="tagList"><li class="empty">Loading...</li></ul>
      <div class="add-row">
        <input type="text" id="newTag" placeholder="New tag name" />
        <button class="btn btn-add" id="addTag">Add</button>
      </div>
      <p class="hint">Uncategorized is system-managed. Deleting a tag that is the only tag on an item moves that item to Uncategorized.</p>
    </div>
  </div>
  <div class="modal-overlay" id="renameModal">
    <div class="modal">
      <h3 id="renameTitle">Rename</h3>
      <input type="text" id="renameInput" />
      <div class="modal-actions">
        <button class="btn-cancel" id="renameCancel">Cancel</button>
        <button class="btn-save" id="renameSave">Save</button>
      </div>
    </div>
  </div>
  <div class="modal-overlay" id="deleteModal">
    <div class="modal">
      <div class="confirm-text"><span class="del-word">DELETE</span> <strong id="deleteName"></strong>?</div>
      <p id="deleteHint" style="font-size:0.85rem;color:#666;margin-bottom:16px"></p>
      <div class="modal-actions">
        <button class="btn-cancel" id="deleteCancel">Cancel</button>
        <button class="btn-danger-full" id="deleteConfirm">Delete</button>
      </div>
    </div>
  </div>
  <div class="toast" id="toast"></div>
  <script>
    const API = "/api";
    let renameTarget = null, deleteTarget = null;
    function toast(msg) { const t = document.getElementById("toast"); t.textContent = msg; t.classList.add("show"); setTimeout(() => t.classList.remove("show"), 2200); }
    function isUncategorized(name) { return (name || "").toLowerCase() === "uncategorized"; }
    const pencil = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>`;
    const trash = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>`;
    function esc(s) { return (s || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
    async function loadPlaces() {
      const places = await (await fetch(`${API}/places`)).json();
      const el = document.getElementById("placeList");
      if (!places.length) { el.innerHTML = `<li class="empty">No places yet</li>`; return; }
      el.innerHTML = places.map(p => `<li><span class="name">${esc(p.name)}</span><div class="actions"><button class="btn btn-icon" data-action="rename" data-type="place" data-id="${p.id}" data-name="${esc(p.name)}" title="Rename">${pencil}</button><button class="btn btn-del" data-action="delete" data-type="place" data-id="${p.id}" data-name="${esc(p.name)}" title="Delete">${trash}</button></div></li>`).join("");
    }
    async function loadTags() {
      const tags = await (await fetch(`${API}/tags`)).json();
      const el = document.getElementById("tagList");
      if (!tags.length) { el.innerHTML = `<li class="empty">No tags yet</li>`; return; }
      el.innerHTML = tags.map(t => {
        const sys = isUncategorized(t.name);
        return `<li><span class="name ${sys ? "system" : ""}">${esc(t.name)}${sys ? " (system)" : ""}</span><div class="actions">${sys ? "" : `<button class="btn btn-icon" data-action="rename" data-type="tag" data-id="${t.id}" data-name="${esc(t.name)}" title="Rename">${pencil}</button><button class="btn btn-del" data-action="delete" data-type="tag" data-id="${t.id}" data-name="${esc(t.name)}" title="Delete">${trash}</button>`}</div></li>`;
      }).join("");
    }
    document.getElementById("addPlace").addEventListener("click", async () => {
      const name = document.getElementById("newPlace").value.trim(); if (!name) return;
      const res = await fetch(`${API}/places`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ name }) });
      if (res.ok) { document.getElementById("newPlace").value = ""; toast("Place added"); loadPlaces(); }
      else { const err = await res.json().catch(() => ({})); toast(err.error || "Failed"); }
    });
    document.getElementById("addTag").addEventListener("click", async () => {
      const name = document.getElementById("newTag").value.trim(); if (!name) return;
      const res = await fetch(`${API}/tags`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ name }) });
      if (res.ok) { document.getElementById("newTag").value = ""; toast("Tag added"); loadTags(); }
      else { const err = await res.json().catch(() => ({})); toast(err.error || "Failed"); }
    });
    document.addEventListener("click", (e) => {
      const btn = e.target.closest("[data-action]"); if (!btn) return;
      const { action, type, id, name } = btn.dataset;
      if (action === "rename") {
        renameTarget = { type, id, name };
        document.getElementById("renameTitle").textContent = `Rename ${type}`;
        document.getElementById("renameInput").value = name;
        document.getElementById("renameModal").classList.add("open");
        setTimeout(() => document.getElementById("renameInput").focus(), 50);
      }
      if (action === "delete") {
        deleteTarget = { type, id, name };
        document.getElementById("deleteName").textContent = name;
        document.getElementById("deleteHint").textContent = type === "tag" ? "Items that only had this tag will move to Uncategorized." : "Items using this place will have their place cleared.";
        document.getElementById("deleteModal").classList.add("open");
      }
    });
    document.getElementById("renameCancel").addEventListener("click", () => { document.getElementById("renameModal").classList.remove("open"); renameTarget = null; });
    document.getElementById("renameModal").addEventListener("click", (e) => { if (e.target.id === "renameModal") { document.getElementById("renameModal").classList.remove("open"); renameTarget = null; } });
    document.getElementById("renameInput").addEventListener("keydown", (e) => { if (e.key === "Enter") document.getElementById("renameSave").click(); });
    document.getElementById("renameSave").addEventListener("click", async () => {
      if (!renameTarget) return;
      const name = document.getElementById("renameInput").value.trim(); if (!name) { toast("Name required"); return; }
      const path = renameTarget.type === "place" ? "places" : "tags";
      const res = await fetch(`${API}/${path}/${renameTarget.id}`, { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ name }) });
      if (res.ok) { toast("Renamed"); document.getElementById("renameModal").classList.remove("open"); renameTarget = null; loadPlaces(); loadTags(); }
      else { const err = await res.json().catch(() => ({})); toast(err.error || "Rename failed"); }
    });
    document.getElementById("deleteCancel").addEventListener("click", () => { document.getElementById("deleteModal").classList.remove("open"); deleteTarget = null; });
    document.getElementById("deleteModal").addEventListener("click", (e) => { if (e.target.id === "deleteModal") { document.getElementById("deleteModal").classList.remove("open"); deleteTarget = null; } });
    document.getElementById("deleteConfirm").addEventListener("click", async () => {
      if (!deleteTarget) return;
      const path = deleteTarget.type === "place" ? "places" : "tags";
      const res = await fetch(`${API}/${path}/${deleteTarget.id}`, { method: "DELETE" });
      if (res.ok) { toast("Deleted"); document.getElementById("deleteModal").classList.remove("open"); deleteTarget = null; loadPlaces(); loadTags(); }
      else { const err = await res.json().catch(() => ({})); toast(err.error || "Delete failed"); }
    });
    loadPlaces(); loadTags();
  </script>
</body>
</html>
