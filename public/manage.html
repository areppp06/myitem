<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manage – MyItem</title>
  <meta name="theme-color" content="#0058A3" />
  <style>
    :root {
      --ikea-yellow: #FFDA1A;
      --ikea-blue: #0058A3;
      --ikea-blue-dark: #003d73;
      --bg: #f5f5f5;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: #111;
      min-height: 100vh;
    }
    header {
      background: var(--ikea-blue);
      color: white;
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    header a {
      color: white;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
    }
    header h1 { font-size: 1.2rem; }
    .container { max-width: 700px; margin: 0 auto; padding: 20px 16px; }
    .section {
      background: white;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .section h2 {
      font-size: 1.1rem;
      color: var(--ikea-blue);
      margin-bottom: 14px;
    }
    .list { list-style: none; }
    .list li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid #eee;
    }
    .list li:last-child { border-bottom: none; }
    .btn {
      padding: 6px 12px;
      border-radius: 6px;
      border: none;
      font-weight: 600;
      font-size: 0.8rem;
      cursor: pointer;
    }
    .btn-del {
      background: #fee;
      color: #c00;
    }
    .add-row {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }
    .add-row input {
      flex: 1;
      padding: 10px 12px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 15px;
    }
    .btn-add {
      background: var(--ikea-yellow);
      color: var(--ikea-blue);
      padding: 10px 16px;
    }
    .empty { color: #888; font-size: 0.9rem; }
  </style>
</head>
<body>
  <header>
    <a href="/">← Back</a>
    <h1>Manage Places & Tags</h1>
  </header>

  <div class="container">
    <div class="section">
      <h2>📍 Places</h2>
      <ul class="list" id="placeList"><li class="empty">Loading...</li></ul>
      <div class="add-row">
        <input type="text" id="newPlace" placeholder="New place name" />
        <button class="btn btn-add" id="addPlace">Add</button>
      </div>
    </div>

    <div class="section">
      <h2>🏷️ Tags</h2>
      <ul class="list" id="tagList"><li class="empty">Loading...</li></ul>
      <div class="add-row">
        <input type="text" id="newTag" placeholder="New tag name" />
        <button class="btn btn-add" id="addTag">Add</button>
      </div>
    </div>
  </div>

  <script>
    const API = "/api";

    async function loadPlaces() {
      const res = await fetch(`${API}/places`);
      const places = await res.json();
      const el = document.getElementById("placeList");
      if (!places.length) {
        el.innerHTML = `<li class="empty">No places yet</li>`;
        return;
      }
      el.innerHTML = places
        .map(
          (p) => `
        <li>
          <span>${p.name}</span>
          <button class="btn btn-del" data-id="${p.id}" data-type="place">Delete</button>
        </li>`
        )
        .join("");
    }

    async function loadTags() {
      const res = await fetch(`${API}/tags`);
      const tags = await res.json();
      const el = document.getElementById("tagList");
      if (!tags.length) {
        el.innerHTML = `<li class="empty">No tags yet</li>`;
        return;
      }
      el.innerHTML = tags
        .map(
          (t) => `
        <li>
          <span>${t.name}</span>
          <button class="btn btn-del" data-id="${t.id}" data-type="tag">Delete</button>
        </li>`
        )
        .join("");
    }

    document.getElementById("addPlace").addEventListener("click", async () => {
      const name = document.getElementById("newPlace").value.trim();
      if (!name) return;
      await fetch(`${API}/places`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name }),
      });
      document.getElementById("newPlace").value = "";
      loadPlaces();
    });

    document.getElementById("addTag").addEventListener("click", async () => {
      const name = document.getElementById("newTag").value.trim();
      if (!name) return;
      await fetch(`${API}/tags`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name }),
      });
      document.getElementById("newTag").value = "";
      loadTags();
    });

    document.addEventListener("click", async (e) => {
      if (!e.target.classList.contains("btn-del")) return;
      const id = e.target.dataset.id;
      const type = e.target.dataset.type;
      // Note: simple delete - in production add cascade care
      if (!confirm(`Delete this ${type}?`)) return;
      // For now we only support soft or just remove (API doesn't have delete endpoints yet for places/tags to keep simple)
      // You can extend the API later. For MVP we just hide the button effect.
      alert("Delete for places/tags coming in next version. For now just leave them – they don't hurt.");
    });

    loadPlaces();
    loadTags();
  </script>
</body>
</html>
